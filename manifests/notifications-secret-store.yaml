apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: argocd-notifications-openbao
  namespace: argocd
spec:
  provider:
    vault:
      server: http://homelab-openbao.openbao.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: argocd-notifications
          serviceAccountRef:
            name: argocd-notifications-controller
