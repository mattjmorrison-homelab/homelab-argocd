apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.webhook.discord: |
    url: $discord-webhook-url
    headers:
    - name: Content-Type
      value: application/json

  template.deploy-completed: |
    webhook:
      discord:
        method: POST
        body: |
          {"content": "✅ **{{.app.metadata.name}}** deployed — revision `{{.app.status.sync.revision}}`"}

  trigger.on-deployed: |
    - when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
      oncePer: app.status.sync.revision
      send: [deploy-completed]

  subscriptions: |
    - recipients:
      - discord
      triggers:
      - on-deployed
